<div class="poll-results">
  {% with results=poll.results %}
  {% for row in results %}
  <div class="poll-result">
    <div class="poll-result-meta">
      <span class="poll-result-label">{{ row.choice.label }}</span>
      <span class="poll-result-count">{{ row.count }} ({{ row.percent }}%)</span>
    </div>
    <div class="poll-result-track">
      <div class="poll-result-bar" style="--pct: {{ row.percent|stringformat:'g' }}%"></div>
    </div>
  </div>
  {% endfor %}
  {% endwith %}
</div>
