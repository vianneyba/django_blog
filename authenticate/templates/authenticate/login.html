{% extends "base.html" %}

{% block title %}Connexion — {{ TITLE_SITE }}{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Connexion</h1>

    {% if errors %}
    <p class="auth-alert" role="alert">{{ errors }}</p>
    {% endif %}

    <form method="post" action="{% url 'authenticate:login' %}" class="auth-form">
      {% csrf_token %}

      <label class="auth-label" for="username">Nom d’utilisateur</label>
      <input class="auth-input" type="text" id="username" name="username" autocomplete="username" required>

      <label class="auth-label" for="password">Mot de passe</label>
      <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password" required>

      <button class="auth-submit" type="submit">Connexion</button>
    </form>

    <ul class="auth-help">
      <li><a href="{% url 'authenticate:register' %}">Inscripton ?</a></li>
      <li><a href="{% url 'authenticate:login' %}">Mot de passe perdu ?</a></li>
    </ul>

  </div>
</section>
{% endblock %}
